<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142e26"/>
      <stop offset="100%" stop-color="#081813"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00b377" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3f33"/>
      <stop offset="100%" stop-color="#0e231c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="360" r="220" fill="url(#mintGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Tech Grid / Geometric Cross behind silhouette -->
  <g stroke="#00e5a0" stroke-width="1.5" opacity="0.25">
    <circle cx="300" cy="360" r="180" fill="none" stroke-dasharray="8 6"/>
    <circle cx="300" cy="360" r="240" fill="none" stroke-width="1"/>
    <line x1="300" y1="80" x2="300" y2="640" stroke-dasharray="4 4"/>
    <line x1="60" y1="360" x2="540" y2="360" stroke-dasharray="4 4"/>
    <!-- Cross brackets -->
    <path d="M120 180 L140 180 M120 180 L120 200" fill="none"/>
    <path d="M480 180 L460 180 M480 180 L480 200" fill="none"/>
    <path d="M120 540 L140 540 M120 540 L120 520" fill="none"/>
    <path d="M480 540 L460 540 M480 540 L480 520" fill="none"/>
  </g>

  <!-- Stylized Modern Silhouette -->
  <path d="M140 750 C140 570 170 510 220 480 C245 465 240 435 240 420 C220 405 210 380 215 340 C220 300 235 295 245 295 C240 260 250 175 300 170 C350 175 360 260 355 295 C365 295 380 300 385 340 C390 380 380 405 360 420 C360 435 355 465 380 480 C430 510 460 570 460 750 Z" 
        fill="url(#bodyGrad)" stroke="rgba(0, 229, 160, 0.4)" stroke-width="2"/>

  <!-- Inner Head/Neck definition -->
  <path d="M260 370 C270 410 330 410 340 370 C350 310 350 220 300 220 C250 220 250 310 260 370 Z" 
        fill="url(#headGrad)"/>

  <!-- Modern Hairline & Glasses / Smart Tech lines -->
  <path d="M255 230 C270 200 330 200 345 230 C350 250 340 260 335 260 C325 240 275 240 265 260 C260 260 250 250 255 230 Z" 
        fill="#00e5a0" opacity="0.3"/>

  <!-- Folded Arms Accent Lines -->
  <path d="M220 540 C250 500 350 500 380 540 C360 620 240 620 220 540 Z" 
        fill="none" stroke="#00e5a0" stroke-width="2" opacity="0.5"/>
  <path d="M200 580 C260 660 340 660 400 580" 
        fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>

  <!-- Badge Overlay on Silhouette: 'Philipp Kyr / Founder & Engineer' -->
  <g transform="translate(300, 680)">
    <rect x="-160" y="-32" width="320" height="64" rx="32" fill="#061a14" stroke="#00e5a0" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="-125" cy="0" r="10" fill="#00e5a0"/>
    <text x="-95" y="6" font-family="'Roboto', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">PHILIPP KYR</text>
    <text x="35" y="6" font-family="'Roboto', system-ui, sans-serif" font-size="13" font-weight="400" fill="#00e5a0" letter-spacing="0.5">· FOUNDER</text>
  </g>
</svg>
