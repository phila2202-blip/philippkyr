<text x="90" y="940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#54645d" text-anchor="start">Die drei gezeigten Merkmale sind der Anfang einer Reihe, die in der Anwendung mehrere Hundert Stellen umfasst.</text>
<text x="90" y="964" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#54645d" text-anchor="start">Gesucht wird nicht nach exakter Übereinstimmung, sondern nach den nächstgelegenen Punkten.</text>
