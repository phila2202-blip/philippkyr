<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-label="Begriffe derselben Art bilden Gruppen im Merkmalsraum. Die Beziehung von einem Bauteil zu seiner Messgroesse ist fuer jedes Paar derselbe Schritt, mehrere Begriffe koennen auf denselben Punkt fuehren, und dieselbe Beziehung erscheint in den Zahlen als gleiche Differenz.">
