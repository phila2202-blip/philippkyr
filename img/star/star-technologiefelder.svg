<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" aria-label="Die drei untersuchten Technologiefelder: RDF-Formate als Austauschformat, Graphdatenbanken fuer verknuepfte Daten, Vektordatenbanken fuer Aehnlichkeitssuche.">
<rect width="1240" height="500" fill="#ffffff"/>
<text x="44" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0a1f1a">Die drei untersuchten Technologiefelder</text>
<text x="44" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#54645d">Gemeinsames Ziel: Datenheterogenität überwinden und Systeme interoperabel machen</text>
<rect x="44" y="110" width="368" height="330" rx="14" fill="#e4eae6" stroke="#cfdad4"/>
<rect x="44" y="110" width="368" height="70" rx="14" fill="#dfeae5"/>
<rect x="44" y="166" width="368" height="14" fill="#dfeae5"/>
<text x="68" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0a1f1a">RDF-Formate</text>
<text x="68" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#00664f">Austauschformat</text>
<text x="68" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WAS ES IST</text>
<text x="68" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Daten als Tripel aus Subjekt,</text>
<text x="68" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Prädikat und Objekt</text>
<text x="68" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">W3C-Standard, erweiterbar</text>
<text x="68" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WOFÜR</text>
<text x="68" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Heterogene Quellen zusammen-</text>
<text x="68" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">führen, Interoperabilität sichern</text>
<line x1="68" y1="376" x2="388" y2="376" stroke="#cfdad4"/>
<text x="68" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">UNTERSUCHTE SYSTEME</text>
<text x="68" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0a1f1a">RDF, RDFS, OWL, SPARQL</text>
<rect x="436" y="110" width="368" height="330" rx="14" fill="#e4eae6" stroke="#cfdad4"/>
<rect x="436" y="110" width="368" height="70" rx="14" fill="#dfeae5"/>
<rect x="436" y="166" width="368" height="14" fill="#dfeae5"/>
<text x="460" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0a1f1a">Graphdatenbanken</text>
<text x="460" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#00664f">verknüpfte Daten</text>
<text x="460" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WAS ES IST</text>
<text x="460" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Knoten, Kanten und Eigen-</text>
<text x="460" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">schaften statt Tabellen</text>
<text x="460" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">kein JOIN über viele Tabellen</text>
<text x="460" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WOFÜR</text>
<text x="460" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Anlagentopologie, Lieferketten,</text>
<text x="460" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Anomalieerkennung im IIoT</text>
<line x1="460" y1="376" x2="780" y2="376" stroke="#cfdad4"/>
<text x="460" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">UNTERSUCHTE SYSTEME</text>
<text x="460" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0a1f1a">Neo4j, TigerGraph</text>
<rect x="828" y="110" width="368" height="330" rx="14" fill="#e4eae6" stroke="#cfdad4"/>
<rect x="828" y="110" width="368" height="70" rx="14" fill="#dfeae5"/>
<rect x="828" y="166" width="368" height="14" fill="#dfeae5"/>
<text x="852" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0a1f1a">Vektordatenbanken</text>
<text x="852" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#00664f">Ähnlichkeitssuche</text>
<text x="852" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WAS ES IST</text>
<text x="852" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Speicherung hochdimensionaler</text>
<text x="852" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Einbettungen</text>
<text x="852" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">schnelle Nächste-Nachbar-Suche</text>
<text x="852" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">WOFÜR</text>
<text x="852" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">Sprachverarbeitung, Bild-</text>
<text x="852" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#35453e">erkennung, Empfehlungen</text>
<line x1="852" y1="376" x2="1172" y2="376" stroke="#cfdad4"/>
<text x="852" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#54645d" letter-spacing="0.07em">UNTERSUCHTE SYSTEME</text>
<text x="852" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0a1f1a">Pinecone, Chroma, Weaviate</text>
